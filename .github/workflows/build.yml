name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    # CMakePresets.json deliberately targets Visual Studio 17 2022. Pin the
    # matching runner instead of following windows-latest onto VS 2026 images.
    runs-on: windows-2022
    env:
      VULKAN_SDK_VERSION: 1.4.357.0
      BUILD_MODE: debug
      BUILD_CONFIG: Debug
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache Vulkan SDK
        id: cache-vulkan
        uses: actions/cache@v4
        with:
          path: C:\VulkanSDK
          key: vulkan-sdk-${{ env.VULKAN_SDK_VERSION }}-windows

      - name: Install Vulkan SDK
        if: steps.cache-vulkan.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $url = "https://sdk.lunarg.com/sdk/download/${{ env.VULKAN_SDK_VERSION }}/windows/vulkan_sdk.exe"
          curl.exe -f -L $url -o VulkanSDK.exe
          .\VulkanSDK.exe --root C:\VulkanSDK\${{ env.VULKAN_SDK_VERSION }} --accept-licenses --default-answer --confirm-command install

      - name: Set Vulkan environment
        shell: pwsh
        run: |
          echo "VULKAN_SDK=C:\VulkanSDK\${{ env.VULKAN_SDK_VERSION }}" >> $env:GITHUB_ENV
          echo "C:\VulkanSDK\${{ env.VULKAN_SDK_VERSION }}\Bin" >> $env:GITHUB_PATH

      - name: Install Neovim
        shell: pwsh
        run: choco install neovim -y

      - name: Build and test
        env:
          DRAXUL_RUN_SLOW_TESTS: "1"
        run: |
          # Hosted Windows runners expose the SDK/compiler but no Vulkan
          # surface. Keep the real external DLL build and discovery smoke;
          # GPU rendering remains covered on GPU-capable developer machines.
          cmake --preset default -DDRAXUL_ENABLE_EXTERNAL_SDK_RENDER_SMOKE=OFF
          cmd /c scripts\run_tests.bat %BUILD_MODE%

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: draxul-windows-${{ env.BUILD_MODE }}
          path: |
            build/${{ env.BUILD_CONFIG }}/draxul.exe
            build/${{ env.BUILD_CONFIG }}/draxul.pdb
            build/${{ env.BUILD_CONFIG }}/shaders/
            build/${{ env.BUILD_CONFIG }}/fonts/
          if-no-files-found: error

      - name: Upload render test outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-test-out-windows
          path: tests/render/out/
          if-no-files-found: ignore

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Neovim
        run: brew install neovim

      - name: Build and test
        env:
          DRAXUL_RUN_SLOW_TESTS: "1"
        run: bash scripts/run_tests.sh

      - name: Upload render test outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-test-out-macos
          path: tests/render/out/
          if-no-files-found: ignore
